---
- name: Converge native Podman systemd controller against an isolated systemctl
  hosts: localhost
  gather_facts: true
  vars:
    podman_systemd_test_root: "{{ molecule_ephemeral_directory }}/podman-systemd"
    podman_systemd_test_bin: "{{ podman_systemd_test_root }}/bin"
    podman_systemd_test_log: "{{ podman_systemd_test_root }}/systemctl.log"
    podman_systemd_test_manifest: "{{ podman_systemd_test_root }}/pod.yml"
    podman_systemd_test_quadlet_dir: "{{ podman_systemd_test_root }}/quadlet"
  environment:
    PATH: "{{ podman_systemd_test_bin }}:{{ ansible_env.PATH }}"
  tasks:
    - name: Create isolated Podman systemd fixture directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ podman_systemd_test_root }}"
        - "{{ podman_systemd_test_bin }}"

    - name: Write isolated systemctl fixture
      ansible.builtin.copy:
        dest: "{{ podman_systemd_test_bin }}/systemctl"
        mode: "0755"
        content: |
          #!/bin/sh
          set -eu
          printf '%s\n' "$*" >> "{{ podman_systemd_test_log }}"
          case " $* " in
            *" --version "*)
              printf '%s\n' 'systemd 252 (252-46.el9)'
              ;;
            *" show "*)
              printf '%s\n' 'LoadState=loaded'
              printf '%s\n' 'ActiveState=active'
              printf '%s\n' 'SubState=running'
              printf '%s\n' 'UnitFileState=enabled'
              ;;
            *" is-active "*)
              printf '%s\n' active
              ;;
            *" is-enabled "*)
              printf '%s\n' enabled
              ;;
          esac

    - name: Write isolated Kubernetes manifest fixture
      ansible.builtin.copy:
        dest: "{{ podman_systemd_test_manifest }}"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Pod
          metadata:
            name: podman-systemd-basic
          spec:
            containers:
              - name: application
                image: example.invalid/fixture:1

    - name: Prepare a private native log file for the application writer
      ansible.builtin.copy:
        dest: "{{ podman_systemd_test_root }}/application.log"
        content: "synthetic fixture\n"
        mode: "0600"
        force: false

    - name: Converge valid native Quadlet network and restart contract
      ansible.builtin.include_role:
        name: lit.foundational.podman_systemd
      vars:
        podman_systemd_action: present
        podman_systemd_unit_name: podman-systemd-basic
        podman_systemd_manifest_path: "{{ podman_systemd_test_manifest }}"
        podman_systemd_scope: user
        podman_systemd_quadlet_dir: "{{ podman_systemd_test_quadlet_dir }}"
        podman_systemd_networks:
          - "private-access:ip=10.89.0.20"
        podman_systemd_log_path: "{{ podman_systemd_test_root }}/application.log"

    - name: Reject a multiline Quadlet network before mutation
      block:
        - name: Attempt malformed native Quadlet network
          ansible.builtin.include_role:
            name: lit.foundational.podman_systemd
          vars:
            podman_systemd_action: present
            podman_systemd_unit_name: podman-systemd-invalid
            podman_systemd_manifest_path: "{{ podman_systemd_test_manifest }}"
            podman_systemd_scope: user
            podman_systemd_quadlet_dir: "{{ podman_systemd_test_quadlet_dir }}"
            podman_systemd_networks:
              - "private-access\nNetwork=host"
        - name: Reject an accepted malformed network
          ansible.builtin.fail:
            msg: "podman_systemd accepted a multiline network entry"
      rescue:
        - name: Record fail-closed malformed-network rejection
          ansible.builtin.copy:
            dest: "{{ podman_systemd_test_root }}/malformed-network-rejected"
            content: "rejected\n"
            mode: "0600"

    - name: Reject newline in native log destination before mutation
      block:
        - name: Attempt newline in the native destination
          ansible.builtin.include_role:
            name: lit.foundational.podman_systemd
          vars:
            podman_systemd_unit_name: newline-log
            podman_systemd_manifest_path: "{{ podman_systemd_test_manifest }}"
            podman_systemd_quadlet_dir: "{{ podman_systemd_test_quadlet_dir }}"
            podman_systemd_scope: user
            podman_systemd_log_path: "/tmp/test\n[Service]\nExecStart=/bin/false"
      rescue:
        - name: Record rejected newline destination
          ansible.builtin.copy:
            dest: "{{ podman_systemd_test_root }}/newline-log-rejected"
            content: "rejected\n"
            mode: "0600"

    - name: Reject specifier in native log destination before mutation
      block:
        - name: Attempt specifier in the native destination
          ansible.builtin.include_role:
            name: lit.foundational.podman_systemd
          vars:
            podman_systemd_unit_name: specifier-log
            podman_systemd_manifest_path: "{{ podman_systemd_test_manifest }}"
            podman_systemd_quadlet_dir: "{{ podman_systemd_test_quadlet_dir }}"
            podman_systemd_scope: user
            podman_systemd_log_path: "/tmp/%t.log"
      rescue:
        - name: Record rejected specifier destination
          ansible.builtin.copy:
            dest: "{{ podman_systemd_test_root }}/specifier-log-rejected"
            content: "rejected\n"
            mode: "0600"

    - name: Reject traversal in native log destination before mutation
      block:
        - name: Attempt traversal in the native destination
          ansible.builtin.include_role:
            name: lit.foundational.podman_systemd
          vars:
            podman_systemd_unit_name: traversal-log
            podman_systemd_manifest_path: "{{ podman_systemd_test_manifest }}"
            podman_systemd_quadlet_dir: "{{ podman_systemd_test_quadlet_dir }}"
            podman_systemd_scope: user
            podman_systemd_log_path: "/tmp/../test.log"
      rescue:
        - name: Record rejected traversal destination
          ansible.builtin.copy:
            dest: "{{ podman_systemd_test_root }}/traversal-log-rejected"
            content: "rejected\n"
            mode: "0600"

    - name: Write a manifest with incompatible multiple application writers
      ansible.builtin.copy:
        dest: "{{ podman_systemd_test_root }}/multi-pod.yml"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Pod
          metadata:
            name: multiple-writers
          spec:
            containers:
              - {name: first, image: example.invalid/fixture:1}
              - {name: second, image: example.invalid/fixture:1}

    - name: Reject multiple application writers sharing one native file
      block:
        - name: Attempt an incompatible multi-container log destination
          ansible.builtin.include_role:
            name: lit.foundational.podman_systemd
          vars:
            podman_systemd_unit_name: multiple-writers
            podman_systemd_manifest_path: "{{ podman_systemd_test_root }}/multi-pod.yml"
            podman_systemd_quadlet_dir: "{{ podman_systemd_test_quadlet_dir }}"
            podman_systemd_scope: user
            podman_systemd_log_path: "{{ podman_systemd_test_root }}/application.log"
      rescue:
        - name: Record rejected multiple-writer configuration
          ansible.builtin.copy:
            dest: "{{ podman_systemd_test_root }}/multiple-writers-rejected"
            content: "rejected\n"
            mode: "0600"
