---
- name: Converge native Podman systemd controller against an isolated systemctl
  hosts: localhost
  gather_facts: true
  vars:
    podman_systemd_test_root: "{{ molecule_ephemeral_directory }}/podman-systemd"
    podman_systemd_test_native_log_root: /run/lit-podman-systemd-basic-logs
    podman_systemd_test_bin: "{{ podman_systemd_test_root }}/bin"
    podman_systemd_test_log: "{{ podman_systemd_test_root }}/systemctl.log"
    podman_systemd_test_manifest: "{{ podman_systemd_test_root }}/pod.yml"
    podman_systemd_test_quadlet_dir: "{{ podman_systemd_test_root }}/quadlet"
  environment:
    PATH: "{{ podman_systemd_test_bin }}:{{ ansible_env.PATH }}"
  tasks:
    - name: Create isolated Podman systemd fixture directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ podman_systemd_test_root }}"
        - "{{ podman_systemd_test_bin }}"
        - "{{ podman_systemd_test_native_log_root }}"

    - name: Write isolated systemctl fixture
      ansible.builtin.copy:
        dest: "{{ podman_systemd_test_bin }}/systemctl"
        mode: "0755"
        content: |
          #!/bin/sh
          set -eu
          printf '%s\n' "$*" >> "{{ podman_systemd_test_log }}"
          case " $* " in
            *" --version "*)
              printf '%s\n' 'systemd 252 (252-46.el9)'
              ;;
            *" show "*)
              printf '%s\n' 'LoadState=loaded'
              printf '%s\n' 'ActiveState=active'
              printf '%s\n' 'SubState=running'
              printf '%s\n' 'UnitFileState=enabled'
              ;;
            *" is-active "*)
              printf '%s\n' active
              ;;
            *" is-enabled "*)
              printf '%s\n' enabled
              ;;
          esac

    - name: Write isolated Kubernetes manifest fixture
      ansible.builtin.copy:
        dest: "{{ podman_systemd_test_manifest }}"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Pod
          metadata:
            name: podman-systemd-basic
          spec:
            containers:
              - name: application
                image: example.invalid/fixture:1

    - name: Prepare a private native log file for the application writer
      ansible.builtin.copy:
        dest: "{{ podman_systemd_test_native_log_root }}/application.log"
        content: "synthetic fixture\n"
        mode: "0600"
        force: false

    - name: Converge valid native Quadlet network and restart contract
      ansible.builtin.include_role:
        name: lit.foundational.podman_systemd
      vars:
        podman_systemd_action: present
        podman_systemd_unit_name: podman-systemd-basic
        podman_systemd_manifest_path: "{{ podman_systemd_test_manifest }}"
        podman_systemd_scope: user
        podman_systemd_quadlet_dir: "{{ podman_systemd_test_quadlet_dir }}"
        podman_systemd_networks:
          - "private-access:ip=10.89.0.20"
        podman_systemd_log_path: "{{ podman_systemd_test_native_log_root }}/application.log"

    - name: Reject a multiline Quadlet network before mutation
      block:
        - name: Attempt malformed native Quadlet network
          ansible.builtin.include_role:
            name: lit.foundational.podman_systemd
          vars:
            podman_systemd_action: present
            podman_systemd_unit_name: podman-systemd-invalid
            podman_systemd_manifest_path: "{{ podman_systemd_test_manifest }}"
            podman_systemd_scope: user
            podman_systemd_quadlet_dir: "{{ podman_systemd_test_quadlet_dir }}"
            podman_systemd_networks:
              - "private-access\nNetwork=host"
        - name: Reject an accepted malformed network
          ansible.builtin.fail:
            msg: "podman_systemd accepted a multiline network entry"
      rescue:
        - name: Record fail-closed malformed-network rejection
          ansible.builtin.copy:
            dest: "{{ podman_systemd_test_root }}/malformed-network-rejected"
            content: "rejected\n"
            mode: "0600"

    - name: Reject newline in native log destination before mutation
      block:
        - name: Attempt newline in the native destination
          ansible.builtin.include_role:
            name: lit.foundational.podman_systemd
          vars:
            podman_systemd_unit_name: newline-log
            podman_systemd_manifest_path: "{{ podman_systemd_test_manifest }}"
            podman_systemd_quadlet_dir: "{{ podman_systemd_test_quadlet_dir }}"
            podman_systemd_scope: user
            podman_systemd_log_path: "/tmp/test\n[Service]\nExecStart=/bin/false"
      rescue:
        - name: Record rejected newline destination
          ansible.builtin.copy:
            dest: "{{ podman_systemd_test_root }}/newline-log-rejected"
            content: "rejected\n"
            mode: "0600"

    - name: Reject specifier in native log destination before mutation
      block:
        - name: Attempt specifier in the native destination
          ansible.builtin.include_role:
            name: lit.foundational.podman_systemd
          vars:
            podman_systemd_unit_name: specifier-log
            podman_systemd_manifest_path: "{{ podman_systemd_test_manifest }}"
            podman_systemd_quadlet_dir: "{{ podman_systemd_test_quadlet_dir }}"
            podman_systemd_scope: user
            podman_systemd_log_path: "/tmp/%t.log"
      rescue:
        - name: Record rejected specifier destination
          ansible.builtin.copy:
            dest: "{{ podman_systemd_test_root }}/specifier-log-rejected"
            content: "rejected\n"
            mode: "0600"

    - name: Reject traversal in native log destination before mutation
      block:
        - name: Attempt traversal in the native destination
          ansible.builtin.include_role:
            name: lit.foundational.podman_systemd
          vars:
            podman_systemd_unit_name: traversal-log
            podman_systemd_manifest_path: "{{ podman_systemd_test_manifest }}"
            podman_systemd_quadlet_dir: "{{ podman_systemd_test_quadlet_dir }}"
            podman_systemd_scope: user
            podman_systemd_log_path: "/tmp/../test.log"
      rescue:
        - name: Record rejected traversal destination
          ansible.builtin.copy:
            dest: "{{ podman_systemd_test_root }}/traversal-log-rejected"
            content: "rejected\n"
            mode: "0600"

    - name: Write a manifest with incompatible multiple application writers
      ansible.builtin.copy:
        dest: "{{ podman_systemd_test_root }}/multi-pod.yml"
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Pod
          metadata:
            name: multiple-writers
          spec:
            containers:
              - {name: first, image: example.invalid/fixture:1}
              - {name: second, image: example.invalid/fixture:1}

    - name: Reject multiple application writers sharing one native file
      block:
        - name: Attempt an incompatible multi-container log destination
          ansible.builtin.include_role:
            name: lit.foundational.podman_systemd
          vars:
            podman_systemd_unit_name: multiple-writers
            podman_systemd_manifest_path: "{{ podman_systemd_test_root }}/multi-pod.yml"
            podman_systemd_quadlet_dir: "{{ podman_systemd_test_quadlet_dir }}"
            podman_systemd_scope: user
            podman_systemd_log_path: "{{ podman_systemd_test_native_log_root }}/application.log"
      rescue:
        - name: Record rejected multiple-writer configuration
          ansible.builtin.copy:
            dest: "{{ podman_systemd_test_root }}/multiple-writers-rejected"
            content: "rejected\n"
            mode: "0600"

    - name: Prepare an actual trailing-newline file to test the syntax fence
      ansible.builtin.copy:
        dest: "{{ podman_systemd_test_native_log_root }}/trailing-newline.log\n"
        content: "synthetic fixture\n"
        mode: "0600"
        force: false

    - name: Reject a prepared path with only a final newline before mutation
      block:
        - name: Attempt an existing trailing-newline destination
          ansible.builtin.include_role:
            name: lit.foundational.podman_systemd
          vars:
            podman_systemd_unit_name: trailing-newline-log
            podman_systemd_manifest_path: "{{ podman_systemd_test_manifest }}"
            podman_systemd_quadlet_dir: "{{ podman_systemd_test_quadlet_dir }}"
            podman_systemd_scope: user
            podman_systemd_log_path: "{{ podman_systemd_test_native_log_root }}/trailing-newline.log\n"
        - name: Fail if a final newline was accepted
          ansible.builtin.fail:
            msg: A final-newline path was accepted.
      rescue:
        - name: Require rejection at the path-syntax fence
          ansible.builtin.assert:
            that: ansible_failed_task.name == 'Validate the optional native log destination'
        - name: Record the final-newline rejection
          ansible.builtin.copy:
            dest: "{{ podman_systemd_test_root }}/trailing-newline-log-rejected"
            content: "rejected\n"
            mode: "0600"

    - name: Prepare a file without effective write permission
      ansible.builtin.copy:
        dest: "{{ podman_systemd_test_native_log_root }}/unwritable.log"
        content: "synthetic fixture\n"
        mode: "0400"
        force: false

    - name: Reject an unwritable prepared destination before changing a unit
      block:
        - name: Attempt a read-only destination in the actual controller identity
          ansible.builtin.include_role:
            name: lit.foundational.podman_systemd
          vars:
            podman_systemd_unit_name: unwritable-log
            podman_systemd_manifest_path: "{{ podman_systemd_test_manifest }}"
            podman_systemd_quadlet_dir: "{{ podman_systemd_test_quadlet_dir }}"
            podman_systemd_scope: user
            podman_systemd_log_path: "{{ podman_systemd_test_native_log_root }}/unwritable.log"
        - name: Fail if an unwritable destination was accepted
          ansible.builtin.fail:
            msg: An unwritable log file was accepted.
      rescue:
        - name: Require the actual write-access failure
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name == 'Require effective write access to the prepared native log destination'
              - ansible_failed_result.rc == 1
        - name: Record the write-access rejection
          ansible.builtin.copy:
            dest: "{{ podman_systemd_test_root }}/unwritable-log-rejected"
            content: "rejected\n"
            mode: "0600"

    - name: Prepare isolated ancestry fixture directories
      ansible.builtin.file:
        path: "{{ podman_systemd_test_native_log_root }}/{{ item.name }}"
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - {name: shared, mode: "0777"}
        - {name: alias-target, mode: "0755"}

    - name: Prepare regular files below the ancestry fixtures
      ansible.builtin.copy:
        dest: "{{ podman_systemd_test_native_log_root }}/{{ item }}/application.log"
        content: "synthetic fixture\n"
        mode: "0600"
        force: false
      loop: [shared, alias-target]

    - name: Create the ancestor alias negative fixture
      ansible.builtin.file:
        src: "{{ podman_systemd_test_native_log_root }}/alias-target"
        dest: "{{ podman_systemd_test_native_log_root }}/ancestor-alias"
        state: link

    - name: Reject unsafe ancestry before creating a Quadlet
      ansible.builtin.include_tasks: tasks/reject-ancestry.yml
      loop: [shared, ancestor-alias]
      loop_control:
        loop_var: podman_systemd_test_ancestor_case

    - name: Prepare malformed container-field fixtures
      ansible.builtin.copy:
        dest: "{{ podman_systemd_test_root }}/{{ item.name }}.yml"
        content: >-
          {{ {'apiVersion': 'v1', 'kind': 'Pod', 'metadata': {'name': 'fixture'},
              'spec': {'containers': item.containers, 'initContainers': item.initializers}} | to_nice_yaml }}
        mode: "0600"
      loop:
        - {name: containers-string, containers: x, initializers: []}
        - {name: containers-mapping, containers: {application: fixture}, initializers: []}
        - {name: container-scalar-entry, containers: [x], initializers: []}
        - name: initializers-mapping
          containers: [{name: application, image: 'example.invalid/fixture:1'}]
          initializers: {}

    - name: Bind the existing unit and service calls before malformed manifests
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
      loop:
        - "{{ podman_systemd_test_quadlet_dir }}/podman-systemd-basic.kube"
        - "{{ podman_systemd_test_log }}"
      register: podman_systemd_test_before_malformed

    - name: Reject malformed fields before changing the existing unit or service
      ansible.builtin.include_tasks: tasks/reject-manifest-shape.yml
      loop: [containers-string, containers-mapping, container-scalar-entry, initializers-mapping]
      loop_control:
        loop_var: podman_systemd_test_manifest_case

    - name: Inspect the once-only stopped-service fixture marker
      ansible.builtin.stat:
        path: "{{ podman_systemd_test_root }}/missing-log-stop-proven"
      register: podman_systemd_stopped_fixture

    - name: Request stopping an existing service after its log and manifest vanished
      when: not podman_systemd_stopped_fixture.stat.exists
      block:
        - name: Stop the isolated loaded service without opening either missing file
          ansible.builtin.include_role:
            name: lit.foundational.podman_systemd
          vars:
            podman_systemd_action: stopped
            podman_systemd_unit_name: missing-log-stop-fixture
            podman_systemd_manifest_path: "{{ podman_systemd_test_root }}/missing-pod.yml"
            podman_systemd_quadlet_dir: "{{ podman_systemd_test_quadlet_dir }}"
            podman_systemd_scope: user
            podman_systemd_log_path: "{{ podman_systemd_test_root }}/missing.log"
        - name: Require the real Ansible systemd module to have issued the stop
          ansible.builtin.assert:
            that: >-
              'stop missing-log-stop-fixture.service'
              in lookup('ansible.builtin.file', podman_systemd_test_log)
        - name: Record the observed stop command for this synthetic service
          ansible.builtin.copy:
            dest: "{{ podman_systemd_test_root }}/missing-log-stop-proven"
            content: "stop requested through the isolated systemctl fixture\n"
            mode: "0600"

- name: Validate native logging with configured and automatic interpreters without play facts
  hosts: localhost
  gather_facts: false
  vars:
    podman_systemd_test_root: "{{ molecule_ephemeral_directory }}/podman-systemd"
    podman_systemd_test_python: /run/lit-podman-systemd-basic-logs/python-custom
    ansible_python_interpreter: "{{ podman_systemd_test_python }}"
    podman_systemd_unit_name: podman-systemd-basic
    podman_systemd_manifest_path: "{{ podman_systemd_test_root }}/pod.yml"
    podman_systemd_log_path: /run/lit-podman-systemd-basic-logs/application.log
    podman_systemd_quadlet_dir: "{{ podman_systemd_test_root }}/quadlet"
    podman_systemd_scope: user
  tasks:
    - name: Prepare a distinct configured interpreter fixture
      ansible.builtin.file:
        src: "{{ ansible_playbook_python }}"
        dest: "{{ podman_systemd_test_python }}"
        state: link
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Clear all inherited facts before the configured-interpreter check
      ansible.builtin.meta: clear_facts

    - name: Run packaged native prechecks without play-level fact gathering
      ansible.builtin.include_role:
        name: lit.foundational.podman_systemd
        tasks_from: assert

    - name: Require the configured interpreter to execute the ancestry probe
      ansible.builtin.assert:
        that: podman_systemd_log_ancestry_check.cmd[0] == podman_systemd_test_python

    - name: Clear all inherited facts before automatic interpreter discovery
      ansible.builtin.meta: clear_facts

    - name: Run packaged native prechecks through automatic interpreter discovery
      ansible.builtin.include_role:
        name: lit.foundational.podman_systemd
        tasks_from: assert
      vars:
        ansible_python_interpreter: auto_silent

    - name: Require a resolved executable rather than an automatic-selection token
      ansible.builtin.assert:
        that:
          - podman_systemd_log_ancestry_check.cmd[0].startswith('/')
          - >-
            podman_systemd_log_ancestry_check.cmd[0] ==
            podman_systemd_log_python.ansible_facts.ansible_python.executable
