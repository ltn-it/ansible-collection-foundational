---
minor_changes:
  - Add a default-off signed literal IPv4 route for native recovery while retaining
    the exact target hostname, Ed25519 host-key pin and disabled proxy/forwarding boundaries.
  - Share exact SSH Key metadata validation and signed SSH recovery stdin consumption between Ansible actions and
    attested native desktop callers without importing Ansible on the native caller.
  - Preserve existing item, executable, Agent, host-key, signature, replay,
    secret-lifetime and fixed-command boundaries.
bugfixes:
  - Explicitly select native desktop biometric authentication for SSH Key metadata
    operations, matching the Password client.
  - Accept multiword OpenSSH public-key comments from the native Agent without
    changing fingerprint validation or the single-line, size and key-type boundaries.
