---
- name: Prechecks
  ansible.builtin.import_tasks: assert.yml
  tags: always

- name: Validate controller escrow state
  ansible.builtin.import_tasks: controller_preflight.yml
  when: luks_header_escrow_enabled | bool
  tags: always

- name: Validate managed-host temporary state
  ansible.builtin.import_tasks: remote_preflight.yml
  when: luks_header_escrow_enabled | bool

- name: Require the pinned source machine through the bounded shared precheck
  ansible.builtin.script:
    cmd: >-
      {{ (role_path ~ '/../../plugins/module_utils/_source_machine_identity.py') | quote }}
      {{ luks_header_escrow_machine_id_path | quote }}
      {{ luks_header_escrow_expected_machine_id | quote }}
    executable: >-
      {{
        _luks_header_escrow_identity_python
        if _luks_header_escrow_identity_python not in
        ['auto', 'auto_silent', 'auto_legacy', 'auto_legacy_silent']
        else ansible_facts.discovered_interpreter_python | mandatory
      }}
  vars:
    _luks_header_escrow_identity_python: >-
      {{ ansible_python_interpreter | default(lookup('ansible.builtin.config', 'INTERPRETER_PYTHON')) }}
  changed_when: false
  when:
    - luks_header_escrow_enabled | bool
    - luks_header_escrow_expected_machine_id | length > 0
  no_log: true

- name: Discover the installed LUKS2 source
  ansible.builtin.import_tasks: discover.yml
  when: luks_header_escrow_enabled | bool

- name: Persist the installed LUKS2 header escrow
  ansible.builtin.import_tasks: escrow.yml
  when: luks_header_escrow_enabled | bool
