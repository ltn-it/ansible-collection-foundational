---
- name: Clear any previous header revision result
  ansible.builtin.set_fact:
    luks_header_escrow_revision_result: null
    cacheable: false
  changed_when: false
  no_log: true

- name: Require explicit metadata planning enablement
  ansible.builtin.assert:
    that: luks_header_escrow_revision_enabled is boolean
    quiet: true
  tags: always

- name: Inspect one pinned source without a wrapping key
  when: luks_header_escrow_revision_enabled | bool
  block:
    - name: Validate action-scoped header revision inputs
      ansible.builtin.import_tasks: assert-revision.yml
      tags: always

    - name: Validate managed-side snapshot root
      ansible.builtin.import_tasks: remote_preflight.yml

    - name: Discover the installed source device
      ansible.builtin.import_tasks: discover-device.yml

    - name: Inspect exact header bytes without transferring them
      lit.foundational.luks_header_snapshot:
        device: "{{ _luks_header_escrow_device }}"
        expected_uuid: "{{ luks_header_escrow_expected_uuid }}"
        expected_machine_id: "{{ luks_header_escrow_expected_machine_id }}"
        machine_id_path: "{{ luks_header_escrow_machine_id_path }}"
        temporary_root: "{{ luks_header_escrow_remote_temporary_root }}"
        cryptsetup_path: "{{ luks_header_escrow_cryptsetup_path }}"
        max_raw_bytes: "{{ luks_header_escrow_max_raw_bytes }}"
        timeout_seconds: "{{ luks_header_escrow_timeout_seconds }}"
        allow_regular_file_device: "{{ luks_header_escrow_allow_regular_file_device }}"
        include_payload: false
      register: _luks_header_escrow_snapshot
      changed_when: false
      no_log: true

    - name: Require metadata-only capture and completed cleanup
      ansible.builtin.assert:
        that:
          - "'luks_header_b64' not in _luks_header_escrow_snapshot"
          - _luks_header_escrow_snapshot.scratch_removed is sameas true
        quiet: true
      no_log: true

    - name: Publish only the pinned header revision metadata
      ansible.builtin.set_fact:
        luks_header_escrow_revision_result: >-
          {{
            {
              'schema_version': 1,
              'subject': luks_header_escrow_subject,
              'source_machine_id': luks_header_escrow_expected_machine_id,
              'luks_uuid': _luks_header_escrow_snapshot.luks_uuid,
              'header_sha256': _luks_header_escrow_snapshot.raw_sha256,
              'raw_size_bytes': _luks_header_escrow_snapshot.raw_size_bytes | int,
              'scratch_removed': true
            }
          }}
        cacheable: false
      changed_when: false
      no_log: true

  always:
    - name: Clear private snapshot state
      ansible.builtin.set_fact:
        _luks_header_escrow_snapshot: null
        cacheable: false
      changed_when: false
      no_log: true
