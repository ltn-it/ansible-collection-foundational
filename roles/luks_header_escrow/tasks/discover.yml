---
- name: Discover the installed source device
  ansible.builtin.import_tasks: discover-device.yml

- name: Require installed LUKS2 JSON metadata
  ansible.builtin.command:
    argv:
      - "{{ luks_header_escrow_cryptsetup_path }}"
      - luksDump
      - --dump-json-metadata
      - "{{ _luks_header_escrow_device }}"
  changed_when: false
  no_log: true

- name: Read the installed LUKS UUID
  ansible.builtin.command:
    argv:
      - "{{ luks_header_escrow_cryptsetup_path }}"
      - luksUUID
      - "{{ _luks_header_escrow_device }}"
  register: _luks_header_escrow_uuid
  changed_when: false
  no_log: true

- name: Require a non-empty installed LUKS UUID
  ansible.builtin.assert:
    that:
      - _luks_header_escrow_uuid.stdout | trim | length > 0
    fail_msg: "The installed LUKS2 source did not return a UUID."
    quiet: true
  no_log: true

- name: Require the exact expected source UUID before header capture
  ansible.builtin.assert:
    that: _luks_header_escrow_uuid.stdout | trim == luks_header_escrow_expected_uuid
    quiet: true
  when: luks_header_escrow_expected_uuid | length > 0
  no_log: true
