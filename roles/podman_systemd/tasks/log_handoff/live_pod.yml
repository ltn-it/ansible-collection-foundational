---
- name: Inspect and bind the actual live Pod membership
  become: true
  become_user: '{{ podman_systemd_log_handoff_profile.runtime_user }}'
  ansible.builtin.command:
    argv:
      - '{{ podman_systemd_h_python.ansible_facts.ansible_python.executable }}'
      - -c
      - |
        import json,re,subprocess,sys
        container,name,expected_pod,expected_infra,mode=sys.argv[1:]
        def ident(value):
            return isinstance(value,str) and re.fullmatch('[0-9a-f]{64}',value) is not None
        if not ident(container) or not re.fullmatch('[A-Za-z0-9][A-Za-z0-9_.-]*',name):
            raise RuntimeError('INVALID_LIVE_POD_BINDING')
        if mode not in ['live','resume','absent'] or (expected_pod and not ident(expected_pod)):
            raise RuntimeError('INVALID_LIVE_POD_BINDING')
        if expected_infra and not ident(expected_infra):
            raise RuntimeError('INVALID_LIVE_POD_BINDING')
        if mode!='live' and not expected_pod:
            raise RuntimeError('MISSING_ORIGINAL_POD_BINDING')
        def run(args):
            return subprocess.run(['/usr/bin/podman']+args,capture_output=True,text=True,check=False)
        exists=run(['container','exists',container])
        if exists.returncode not in [0,1]:
            raise RuntimeError('LIVE_POD_QUERY_FAILED')
        if exists.returncode==1:
            if mode=='live':
                raise RuntimeError('LIVE_CONTAINER_NOT_FOUND')
            for selector in [expected_pod,name]:
                pod=run(['pod','exists',selector])
                if pod.returncode!=1:
                    raise RuntimeError('ORIGINAL_POD_STILL_EXISTS' if pod.returncode==0 else 'LIVE_POD_QUERY_FAILED')
            print(json.dumps(dict(absent=True)))
            sys.exit(0)
        if mode=='absent':
            raise RuntimeError('OLD_CONTAINER_STILL_PRESENT')
        selected=run(['inspect',container,'--format','{{ "{{.Pod}}" }}'])
        pod_id=selected.stdout.strip()
        if selected.returncode!=0 or not ident(pod_id):
            raise RuntimeError('LIVE_POD_QUERY_FAILED')
        result=run(['pod','inspect',pod_id])
        if result.returncode!=0:
            raise RuntimeError('LIVE_POD_QUERY_FAILED')
        docs=json.loads(result.stdout)
        if not isinstance(docs,list) or len(docs)!=1 or not isinstance(docs[0],dict):
            raise RuntimeError('INVALID_LIVE_POD_METADATA')
        pod=docs[0];infra=pod.get('InfraContainerID');members=pod.get('Containers')
        if pod.get('Id')!=pod_id or pod.get('Name')!=name:
            raise RuntimeError('LIVE_POD_NAME_OR_ID_MISMATCH')
        if not isinstance(infra,str) or (infra and not ident(infra)):
            raise RuntimeError('INVALID_LIVE_POD_METADATA')
        if expected_pod and (pod_id!=expected_pod or infra!=expected_infra):
            raise RuntimeError('ORIGINAL_POD_IDENTITY_CHANGED')
        if not isinstance(members,list) or any(not isinstance(m,dict) for m in members):
            raise RuntimeError('INVALID_LIVE_POD_METADATA')
        ids=[m.get('Id') for m in members];expected={container}|({infra} if infra else set())
        if (any(not ident(i) for i in ids) or len(ids)!=len(set(ids)) or set(ids)!=expected or
                any(m.get('State')!='running' for m in members)):
            raise RuntimeError('UNSUPPORTED_LIVE_POD_MEMBERS')
        print(json.dumps(dict(absent=False,pod_id=pod_id,pod_name=name,infra_id=infra)))
      - '{{ podman_systemd_h_pod_container }}'
      - '{{ podman_systemd_h_pod_name }}'
      - '{{ podman_systemd_h_pod_expected | default("") }}'
      - '{{ podman_systemd_h_infra_expected | default("") }}'
      - '{{ podman_systemd_h_pod_mode | default("live") }}'
  register: podman_systemd_h_live_pod
  changed_when: false
  no_log: true
