---
- name: Restore the complete durable plan
  ansible.builtin.include_tasks: load.yml
- name: Recheck every original Pod before creating any hold
  ansible.builtin.include_tasks: live_pod.yml
  vars:
    podman_systemd_h_pod_container: '{{ podman_systemd_h_saved[podman_systemd_h_name].id }}'
    podman_systemd_h_pod_name: '{{ podman_systemd_h_saved[podman_systemd_h_name].pod_name }}'
    podman_systemd_h_pod_expected: '{{ podman_systemd_h_saved[podman_systemd_h_name].pod_id }}'
    podman_systemd_h_infra_expected: '{{ podman_systemd_h_saved[podman_systemd_h_name].infra_id }}'
    podman_systemd_h_pod_mode: live
  loop: '{{ podman_systemd_h_names }}'
  loop_control:
    loop_var: podman_systemd_h_item
- name: Create or adopt exactly the planned holds
  ansible.builtin.include_tasks: hold_one.yml
  loop: '{{ podman_systemd_h_names }}'
  loop_control:
    loop_var: podman_systemd_h_item
