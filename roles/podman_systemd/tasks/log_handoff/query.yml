---
- name: Inspect only the selected running application metadata
  become: true
  become_user: '{{ podman_systemd_log_handoff_profile.runtime_user }}'
  ansible.builtin.command:
    argv:
      - /usr/bin/podman
      - inspect
      - '{{ podman_systemd_h_spec.container }}'
      - --format
      - >-
        {{ "{{.Id}} {{.State.Running}} {{.State.ConmonPid}} {{.HostConfig.LogConfig.Path}}
        {{.Config.Labels.PODMAN_SYSTEMD_UNIT}}"
        }}
    chdir: '{{ podman_systemd_h_home }}'
  register: podman_systemd_h_current
  changed_when: false
- name: Require the exact legacy native source and unit binding
  ansible.builtin.assert:
    that:
      - podman_systemd_h_current.stdout.split() | length == 5
      - podman_systemd_h_current.stdout.split()[0] is match('^[0-9a-f]{64}$')
      - podman_systemd_h_current.stdout.split()[1] == 'true'
      - podman_systemd_h_current.stdout.split()[2] | int > 1
      - >-
        podman_systemd_h_current.stdout.split()[3] == podman_systemd_h_graph ~ '/overlay-containers/' ~
        podman_systemd_h_current.stdout.split()[0]
        ~ '/userdata/ctr.log'
      - podman_systemd_h_current.stdout.split()[4] == podman_systemd_h_spec.unit ~ '.service'
    quiet: true
- name: Read the live native source and original manifest and definition
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    get_checksum: false
    get_mime: false
  loop:
    - '{{ podman_systemd_h_current.stdout.split()[3] }}'
    - '{{ podman_systemd_h_spec.manifest }}'
    - '{{ podman_systemd_h_spec.quadlet }}'
    - '{{ podman_systemd_h_stage }}'
  register: podman_systemd_h_source_stats
- name: Require a canonical owned source on the holding filesystem
  ansible.builtin.assert:
    that:
      - podman_systemd_h_source_stats.results[0].stat.isreg
      - not podman_systemd_h_source_stats.results[0].stat.islnk
      - >-
        podman_systemd_h_source_stats.results[0].stat.uid == podman_systemd_log_handoff_profile.runtime_uid
      - podman_systemd_h_source_stats.results[0].stat.nlink == 1
      - >-
        podman_systemd_h_source_stats.results[0].stat.dev == podman_systemd_h_source_stats.results[3].stat.dev
      - podman_systemd_h_source_stats.results[1].stat.isreg
      - not podman_systemd_h_source_stats.results[1].stat.islnk
      - podman_systemd_h_source_stats.results[1].stat.nlink == 1
      - podman_systemd_h_source_stats.results[2].stat.isreg
      - not podman_systemd_h_source_stats.results[2].stat.islnk
      - podman_systemd_h_source_stats.results[2].stat.nlink == 1
    quiet: true
- name: Hash only the immutable original definition files
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    checksum_algorithm: sha256
    get_mime: false
  loop:
    - '{{ podman_systemd_h_spec.manifest }}'
    - '{{ podman_systemd_h_spec.quadlet }}'
  register: podman_systemd_h_definition_hashes
- name: Bind the original manifest to the reviewed input
  ansible.builtin.assert:
    that:
      - >-
        podman_systemd_h_definition_hashes.results[0].stat.checksum == podman_systemd_h_spec.manifest_sha256
    quiet: true
- name: Record the original conmon start identity
  become: true
  become_user: '{{ podman_systemd_log_handoff_profile.runtime_user }}'
  ansible.builtin.command:
    argv:
      - '{{ podman_systemd_h_python.ansible_facts.ansible_python.executable }}'
      - -c
      - |
        import pathlib,sys
        process=pathlib.Path("/proc/"+sys.argv[1]+"/stat")
        print(process.read_text().rsplit(")",1)[1].split()[19])
      - '{{ podman_systemd_h_current.stdout.split()[2] }}'
    chdir: '{{ podman_systemd_h_home }}'
  register: podman_systemd_h_old_start
  changed_when: false
- name: Assemble only nonsecret planned source identities
  ansible.builtin.set_fact:
    podman_systemd_h_saved: >-
      {{ podman_systemd_h_saved | combine({podman_systemd_h_name: {'id': podman_systemd_h_current.stdout.split()[0],
      'conmon': podman_systemd_h_current.stdout.split()[2], 'log': podman_systemd_h_current.stdout.split()[3],
      'start': podman_systemd_h_old_start.stdout, 'source_inode': podman_systemd_h_source_stats.results[0].stat.inode,
      'source_dev': podman_systemd_h_source_stats.results[0].stat.dev, 'stage_inode':
      podman_systemd_h_source_stats.results[3].stat.inode,
      'manifest_sha256': podman_systemd_h_definition_hashes.results[0].stat.checksum, 'quadlet_sha256':
      podman_systemd_h_definition_hashes.results[1].stat.checksum}})
      }}
