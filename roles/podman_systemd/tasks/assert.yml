---
- name: Validate podman_systemd variables
  ansible.builtin.assert:
    that:
      - podman_systemd_action in podman_systemd_allowed_actions
      - podman_systemd_allowed_actions is sequence
      - podman_systemd_allowed_actions is not string
      - podman_systemd_unit_name | default('', true) | trim | length > 0
      - podman_systemd_description | default('', true) | trim | length > 0
      - podman_systemd_manifest_path | default('', true) | trim | length > 0
      - podman_systemd_scope in ['system', 'user']
      - podman_systemd_quadlet_dir | default('', true) | trim | length > 0
      - podman_systemd_quadlet_path | default('', true) | trim | length > 0
      - podman_systemd_service_name | default('', true) | trim | length > 0
      - podman_systemd_enabled is boolean
      - podman_systemd_remove_quadlet is boolean
      - podman_systemd_after is sequence
      - podman_systemd_after is not string
      - podman_systemd_wants is sequence
      - podman_systemd_wants is not string
      - podman_systemd_networks is sequence
      - podman_systemd_networks is not string
      - >-
        podman_systemd_networks
        | select('string')
        | list
        | length == podman_systemd_networks | length
      - >-
        podman_systemd_networks
        | map('trim')
        | reject('equalto', '')
        | list
        | length == podman_systemd_networks | length
      - >-
        podman_systemd_networks
        | select('search', '[\r\n]')
        | list
        | length == 0
    fail_msg: "podman_systemd variables are missing or invalid."
  tags: always

- name: Validate the optional native log destination
  ansible.builtin.assert:
    that:
      - podman_systemd_log_path is string
      - >-
        podman_systemd_log_path == '' or
        (podman_systemd_log_path is match('^/[A-Za-z0-9_./-]+\Z') and
         not podman_systemd_log_path.endswith('/') and
         '..' not in podman_systemd_log_path.split('/') and
         '.' not in podman_systemd_log_path.split('/') and
         '//' not in podman_systemd_log_path)
    fail_msg: >-
      The native log destination must be an absolute canonical path without
      unit specifiers or control characters.
  tags: always

- name: Require the teardown manifest before stopping a native-log service
  ansible.builtin.command:
    argv: [/usr/bin/test, -f, "{{ podman_systemd_manifest_path }}", -a, -r, "{{ podman_systemd_manifest_path }}"]
  changed_when: false
  check_mode: false
  when:
    - podman_systemd_log_path | length > 0
    - podman_systemd_action == 'stopped'
  tags: always

- name: Resolve the actual Ansible Python interpreter for native log validation
  ansible.builtin.setup:
    gather_subset: ['!all', '!min', python]
    filter: [ansible_python]
  register: podman_systemd_log_python
  when:
    - podman_systemd_log_path | length > 0
    - podman_systemd_action not in ['absent', 'stopped']
  tags: always

- name: Require trusted directory ancestry for the native log destination
  ansible.builtin.command:
    argv:
      - "{{ podman_systemd_log_python.ansible_facts.ansible_python.executable }}"
      - -c
      - |
        import os,pathlib,stat,sys
        allowed_owners = {0, os.geteuid()}
        for directory in reversed(pathlib.Path(sys.argv[1]).parents):
            info = directory.lstat()
            if (not stat.S_ISDIR(info.st_mode)
                    or info.st_uid not in allowed_owners
                    or stat.S_IMODE(info.st_mode) & 0o022):
                sys.exit(1)
      - "{{ podman_systemd_log_path }}"
  changed_when: false
  check_mode: false
  register: podman_systemd_log_ancestry_check
  when:
    - podman_systemd_log_path | length > 0
    - podman_systemd_action not in ['absent', 'stopped']
  tags: always

- name: Read the single-container manifest before selecting a shared native log path
  ansible.builtin.slurp:
    src: "{{ podman_systemd_manifest_path }}"
  register: podman_systemd_log_manifest
  when:
    - podman_systemd_log_path | length > 0
    - podman_systemd_action not in ['absent', 'stopped']
  no_log: true
  tags: always

- name: Require exactly one Pod application container without initializers
  ansible.builtin.assert:
    that:
      - podman_systemd_log_documents | length == 1
      - podman_systemd_log_documents[0] is mapping
      - podman_systemd_log_documents[0].kind | default('') == 'Pod'
      - podman_systemd_log_documents[0].spec | default(none) is mapping
      - podman_systemd_log_containers is sequence
      - podman_systemd_log_containers is not string
      - podman_systemd_log_containers is not mapping
      - podman_systemd_log_containers | length == 1
      - podman_systemd_log_containers[0] is mapping
      - podman_systemd_log_initializers is sequence
      - podman_systemd_log_initializers is not string
      - podman_systemd_log_initializers is not mapping
      - podman_systemd_log_initializers | length == 0
    fail_msg: >-
      A shared native log path requires one Pod with one mapping-shaped application
      container and an empty initializer sequence.
  vars:
    podman_systemd_log_documents: "{{ podman_systemd_log_manifest.content | b64decode | from_yaml_all | list }}"
    podman_systemd_log_containers: "{{ podman_systemd_log_documents[0].spec.containers | default(none) }}"
    podman_systemd_log_initializers: "{{ podman_systemd_log_documents[0].spec.initContainers | default([]) }}"
  when:
    - podman_systemd_log_path | length > 0
    - podman_systemd_action not in ['absent', 'stopped']
  no_log: true
  tags: always

- name: Inspect the prepared native log destination without following links
  ansible.builtin.stat:
    path: "{{ podman_systemd_log_path }}"
    follow: false
    get_checksum: false
    get_mime: false
  register: podman_systemd_log_file
  when:
    - podman_systemd_log_path | length > 0
    - podman_systemd_action not in ['absent', 'stopped']
  tags: always

- name: Require a prepared unlinked regular native log file
  ansible.builtin.assert:
    that:
      - podman_systemd_log_file.stat.exists
      - podman_systemd_log_file.stat.isreg | default(false)
      - not podman_systemd_log_file.stat.islnk | default(false)
      - podman_systemd_log_file.stat.nlink == 1
    fail_msg: Prepare a regular native log file and private parent directory before managing the kube unit.
  when:
    - podman_systemd_log_path | length > 0
    - podman_systemd_action not in ['absent', 'stopped']
  tags: always

- name: Require effective write access to the prepared native log destination
  ansible.builtin.command:
    argv: [/usr/bin/test, -w, "{{ podman_systemd_log_path }}"]
  changed_when: false
  check_mode: false
  when:
    - podman_systemd_log_path | length > 0
    - podman_systemd_action not in ['absent', 'stopped']
  tags: always
