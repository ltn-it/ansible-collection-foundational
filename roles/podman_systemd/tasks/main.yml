---
- name: Prechecks
  ansible.builtin.import_tasks: assert.yml
  tags: always

- name: Read the Podman kube service load state before teardown
  ansible.builtin.command:
    argv: >-
      {{ ['systemctl'] + (['--user'] if podman_systemd_scope == 'user' else []) +
         ['show', podman_systemd_service_name, '--property=LoadState', '--value'] }}
  register: podman_systemd_removal_load
  changed_when: false
  check_mode: false
  failed_when: >-
    podman_systemd_removal_load.rc != 0 or
    podman_systemd_removal_load.stdout | trim not in ['loaded', 'not-found']
  when: podman_systemd_action in ['stopped', 'absent']
  tags: podman_systemd

- name: Read activity when the Podman kube unit fragment is unavailable
  ansible.builtin.command:
    argv: >-
      {{ ['systemctl'] + (['--user'] if podman_systemd_scope == 'user' else []) +
         ['show', podman_systemd_service_name, '--property=LoadState,ActiveState'] }}
  register: podman_systemd_missing_fragment_state
  changed_when: false
  check_mode: false
  failed_when: podman_systemd_missing_fragment_state.rc not in [0, 4]
  when:
    - podman_systemd_action in ['stopped', 'absent']
    - podman_systemd_removal_load.stdout | trim == 'not-found'
  tags: podman_systemd

- name: Require an inactive service when its loaded fragment is unavailable
  ansible.builtin.assert:
    that:
      - "'LoadState=not-found' in podman_systemd_missing_fragment_state.stdout_lines"
      - "'ActiveState=inactive' in podman_systemd_missing_fragment_state.stdout_lines"
    quiet: true
    fail_msg: >-
      A missing unit fragment does not prove that its service has stopped.
      Restore the original Quadlet and its loaded teardown manifest, reconcile
      the manager, and verify teardown before removing the definition.
  when:
    - podman_systemd_action in ['stopped', 'absent']
    - podman_systemd_removal_load.stdout | trim == 'not-found'
  tags: podman_systemd

- name: Validate the actual loaded native teardown configuration
  ansible.builtin.include_tasks:
    file: teardown_preflight.yml
    apply:
      tags: podman_systemd
  when:
    - podman_systemd_action in ['stopped', 'absent']
    - podman_systemd_removal_load.stdout | trim == 'loaded'
  tags: podman_systemd

- name: Ensure Quadlet directory exists
  ansible.builtin.file:
    path: "{{ podman_systemd_quadlet_dir }}"
    state: directory
    mode: "0755"
  when: podman_systemd_action not in ['absent', 'stopped']
  tags:
    - podman_systemd

- name: Render Podman kube Quadlet unit
  ansible.builtin.template:
    src: kube.quadlet.j2
    dest: "{{ podman_systemd_quadlet_path }}"
    mode: "0644"
  register: podman_systemd_quadlet_render
  when: podman_systemd_action not in ['absent', 'stopped']
  tags:
    - podman_systemd

- name: Reload systemd for Podman kube service
  ansible.builtin.systemd:
    daemon_reload: true
    scope: "{{ podman_systemd_scope }}"
  when:
    - podman_systemd_action not in ['absent', 'stopped']
    - podman_systemd_scope == 'system'
  tags:
    - podman_systemd

- name: Reload user systemd for Podman kube service
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  when:
    - podman_systemd_action not in ['absent', 'stopped']
    - podman_systemd_scope == 'user'
  tags:
    - podman_systemd

- name: Manage Podman kube service state
  ansible.builtin.systemd:
    name: "{{ podman_systemd_service_name }}"
    state: >-
      {{
        'restarted'
        if (
          podman_systemd_quadlet_render.changed | default(false) | bool
          and podman_systemd_action in ['present', 'started']
        )
        else (
          'started'
          if podman_systemd_action == 'present'
          else podman_systemd_action
        )
      }}
    enabled: "{{ omit if podman_systemd_action == 'stopped' else podman_systemd_enabled }}"
    scope: "{{ podman_systemd_scope }}"
  when: podman_systemd_action in ['present', 'started', 'restarted', 'stopped']
  tags:
    - podman_systemd

- name: Stop the loaded Podman kube service before disabling or removing it
  ansible.builtin.systemd:
    name: "{{ podman_systemd_service_name }}"
    state: stopped
    scope: "{{ podman_systemd_scope }}"
  when:
    - podman_systemd_action == 'absent'
    - podman_systemd_removal_load.stdout | trim == 'loaded'
  tags:
    - podman_systemd

- name: Verify the Podman kube service state after teardown
  ansible.builtin.command:
    argv: >-
      {{ ['systemctl'] + (['--user'] if podman_systemd_scope == 'user' else []) +
         ['show', podman_systemd_service_name, '--property=LoadState,ActiveState,Result'] }}
  register: podman_systemd_removal_result
  changed_when: false
  when:
    - podman_systemd_action in ['stopped', 'absent']
    - podman_systemd_action == 'stopped' or podman_systemd_removal_load.stdout | trim == 'loaded'
    - not ansible_check_mode
  tags:
    - podman_systemd

- name: Require successful Podman kube service teardown before Quadlet removal
  ansible.builtin.assert:
    that:
      - >-
        'LoadState=not-found' in podman_systemd_removal_result.stdout_lines or
        ('LoadState=loaded' in podman_systemd_removal_result.stdout_lines and
         'ActiveState=inactive' in podman_systemd_removal_result.stdout_lines and
         'Result=success' in podman_systemd_removal_result.stdout_lines)
    fail_msg: >-
      Podman kube teardown is unconfirmed. Keep the Quadlet and manifest,
      recover the failed service and pod, and retry removal only after a successful stop.
    quiet: true
  when:
    - podman_systemd_action in ['stopped', 'absent']
    - podman_systemd_action == 'stopped' or podman_systemd_removal_load.stdout | trim == 'loaded'
    - not ansible_check_mode
  tags:
    - podman_systemd

- name: Disable Podman kube service only after confirmed teardown
  ansible.builtin.systemd:
    name: "{{ podman_systemd_service_name }}"
    enabled: false
    scope: "{{ podman_systemd_scope }}"
  when:
    - podman_systemd_action == 'absent'
    - podman_systemd_removal_load.stdout | trim == 'loaded'
  tags: podman_systemd

- name: Remove Podman kube Quadlet unit
  ansible.builtin.file:
    path: "{{ podman_systemd_quadlet_path }}"
    state: absent
  when:
    - podman_systemd_action == 'absent'
    - podman_systemd_remove_quadlet | bool
  tags:
    - podman_systemd

- name: Reload systemd after Podman kube service removal
  ansible.builtin.systemd:
    daemon_reload: true
    scope: "{{ podman_systemd_scope }}"
  when: podman_systemd_action == 'absent'
  tags:
    - podman_systemd
