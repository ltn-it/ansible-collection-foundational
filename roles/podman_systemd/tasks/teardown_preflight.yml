---
- name: Resolve the executing Python interpreter for loaded service inspection
  ansible.builtin.setup:
    gather_subset: ['!all', '!min', python]
    filter: [ansible_python]
  register: podman_systemd_teardown_python

- name: Inspect native teardown sources from the loaded manager command arrays
  ansible.builtin.command:
    argv:
      - "{{ podman_systemd_teardown_python.ansible_facts.ansible_python.executable }}"
      - -c
      - |
        import json,os,pathlib,stat,subprocess,sys
        result={'ok':False,'reason':'loaded_configuration_unavailable'}
        try:
            base=['busctl']+(['--user'] if sys.argv[1]=='user' else [])+['--json=short']
            def require(condition):
                if not condition:
                    raise ValueError('loaded_configuration')
            def query(arguments):
                call=subprocess.run(base+arguments,capture_output=True,text=True,timeout=15,check=True)
                return json.loads(call.stdout)
            unit=query(['call','org.freedesktop.systemd1','/org/freedesktop/systemd1',
                        'org.freedesktop.systemd1.Manager','GetUnit','s',sys.argv[2]])
            require(unit['type']=='o' and len(unit['data'])==1 and unit['data'][0].startswith('/'))
            def commands(property_name):
                value=query(['get-property','org.freedesktop.systemd1',unit['data'][0],
                             'org.freedesktop.systemd1.Service',property_name])
                require(value['type']=='a(sasbttttuii)' and isinstance(value['data'],list))
                for row in value['data']:
                    require(isinstance(row,list) and len(row)==10 and isinstance(row[1],list))
                    require(isinstance(row[0],str) and row[1] and all(isinstance(item,str) for item in row[1]))
                    require(isinstance(row[2],bool))
                return [(row[0],row[1],row[2]) for row in value['data']]
            def podman_kube(binary,argv,action):
                return (pathlib.PurePosixPath(binary).name=='podman' and
                        any(argv[index:index+2]==['kube',action] for index in range(len(argv)-1)))
            def option_values(argv,name):
                values=[]
                for index,item in enumerate(argv):
                    if item==name:
                        require(index+1<len(argv) and not argv[index+1].startswith('-'))
                        values.append(argv[index+1])
                    elif item.startswith(name+'='):
                        values.append(item[len(name)+1:])
                return values
            def manifest(argv,action):
                require(argv[1:3]==['kube',action])
                booleans={'--replace','--service-container'} if action=='play' else {'--force'}
                valued={'--network','--log-driver','--log-opt'} if action=='play' else set()
                files=[];index=3
                while index<len(argv):
                    item=argv[index]
                    if item=='--':
                        files.extend(argv[index+1:]);break
                    name,separator,value=item.partition('=')
                    if name in booleans:
                        require(not separator or value in {'true','false'})
                    elif name in valued:
                        if not separator:
                            index+=1
                            require(index<len(argv) and not argv[index].startswith('-'))
                            value=argv[index]
                        require(bool(value))
                    elif item.startswith('-'):
                        raise ValueError('unsupported_loaded_option')
                    else:
                        files.append(item)
                    index+=1
                require(len(files)==1 and pathlib.PurePosixPath(files[0]).is_absolute())
                return files[0]
            starts=commands('ExecStart')
            native=[(argv,ignored) for binary,argv,ignored in starts if podman_kube(binary,argv,'play') and
                    any(item.startswith('path=') for item in option_values(argv,'--log-opt'))]
            if native:
                require(len(native)==1 and not native[0][1])
                require(option_values(native[0][0],'--log-driver')==['k8s-file'])
                source=manifest(native[0][0],'play')
                stops=commands('ExecStop')+commands('ExecStopPost')
                downs=[(argv,ignored) for binary,argv,ignored in stops if podman_kube(binary,argv,'down')]
                require(bool(downs) and all(not ignored for argv,ignored in downs))
                require({manifest(argv,'down') for argv,ignored in downs}=={source})
                require(stat.S_ISREG(os.stat(source).st_mode) and os.access(source,os.R_OK))
            result={'ok':True,'native':bool(native)}
        except Exception as error:
            result['error']=type(error).__name__
        print(json.dumps(result,sort_keys=True))
      - "{{ podman_systemd_scope }}"
      - "{{ podman_systemd_service_name }}"
  changed_when: false
  check_mode: false
  no_log: true
  register: podman_systemd_teardown_probe

- name: Require the loaded native teardown source before any service mutation
  ansible.builtin.assert:
    that:
      - podman_systemd_teardown_probe.rc == 0
      - (podman_systemd_teardown_probe.stdout | from_json).ok | bool
    quiet: true
    fail_msg: >-
      The loaded service does not expose a verified readable native teardown manifest.
      Inspect its loaded ExecStart/ExecStop/ExecStopPost through the systemd bus,
      restore that source and retry without reloading or changing enablement first.
      Desired manifest or logging inputs cannot override this prerequisite.
